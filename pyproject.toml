[project]
name = "booking-bot-test-assignment"
version = "0.1.0"
description = "Тестовое задание для AI Engineer"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.8",
    "pydantic-ai>=0.0.13",
    "langchain>=0.3",
    "langchain-openai>=0.2",
    "python-dotenv>=1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ai_admin"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
